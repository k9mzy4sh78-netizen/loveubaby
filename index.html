
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16090e">
<title>Love You Baby ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #16090e;
  --wine: #501c2c;
  --gold: #d8b77a;
  --cream: #f8eadb;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 40%, #48202d 0%, #241019 45%, #10070b 100%);
  color: var(--cream);
  font-family: 'Montserrat', sans-serif;
}

button {
  font: inherit;
}

#app {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  position: relative;
  isolation: isolate;
}

.glow {
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: #a33b5b;
  filter: blur(120px);
  opacity: .16;
  pointer-events: none;
  z-index: -1;
}

.glow.one {
  top: -100px;
  left: -100px;
}

.glow.two {
  right: -100px;
  bottom: -100px;
}

/* INTRO */

#intro {
  width: 100%;
  max-width: 500px;
  text-align: center;
  animation: appear 1.2s ease;
}

.ornament {
  color: var(--gold);
  font-size: 26px;
  letter-spacing: 12px;
  margin-bottom: 28px;
}

.small-title {
  font-size: 10px;
  letter-spacing: 5px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 22px;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(55px, 12vw, 85px);
  font-weight: 500;
  line-height: .95;
  color: var(--cream);
  margin-bottom: 22px;
}

.question {
  color: #d5b9b2;
  font-size: 12px;
  letter-spacing: 4px;
  margin-bottom: 45px;
}

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
}

.yes-btn, .no-btn {
  width: 130px;
  padding: 15px 10px;
  border-radius: 3px;
  letter-spacing: 3px;
  font-size: 11px;
  cursor: pointer;
}

.yes-btn {
  color: #210d14;
  background: linear-gradient(135deg, #f2d9a5, #c49b5e);
  border: 1px solid var(--gold);
  transition: .3s;
}

.yes-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 30px #d8b77a55;
}

.no-btn {
  color: #9a7c80;
  background: #ffffff08;
  border: 1px solid #76515c;
  opacity: .55;
  cursor: not-allowed;
}

.bottom-ornament {
  margin-top: 65px;
  color: #a77a70;
  font-size: 12px;
  letter-spacing: 7px;
}

/* STORY */

#story {
  display: none;
  width: 100%;
  max-width: 900px;
  text-align: center;
  animation: appear .8s ease;
}

.top-line {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin-bottom: 25px;
  opacity: .65;
}

.progress-wrap {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 25px;
}

.progress {
  height: 2px;
  width: 32px;
  background: #69434d;
  transition: .4s;
}

.progress.active {
  background: var(--gold);
  box-shadow: 0 0 8px #d8b77a88;
}

.slide-count {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 4px;
  margin-bottom: 25px;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(10px, 3vw, 25px);
  max-width: 760px;
  margin: 0 auto;
}

.photo-card {
  background: #f4e8d8;
  padding: 10px 10px 18px;
  box-shadow: 0 15px 40px #0008;
  transform: rotate(-2deg);
  transition: .5s;
  aspect-ratio: 0.78;
  overflow: hidden;
}

.photo-card:nth-child(2) {
  transform: rotate(2deg);
  margin-top: 25px;
}

.photo-card:hover {
  transform: rotate(0deg) translateY(-5px);
}

.photo-card img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #3b202a;
}

.photo-card img.missing {
  visibility: hidden;
}

.nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  margin-top: 35px;
}

.nav button {
  background: transparent;
  border: 1px solid #a17b64;
  color: var(--cream);
  padding: 12px 24px;
  font-size: 10px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: .3s;
}

.nav button:hover {
  background: var(--gold);
  color: #1b0b10;
}

.nav button:disabled {
  opacity: .25;
  cursor: default;
}

#endMessage {
  display: none;
  margin-top: 25px;
  color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  letter-spacing: 3px;
}

.heart {
  position: fixed;
  bottom: -30px;
  color: #d98ba0;
  pointer-events: none;
  animation: floatUp linear forwards;
  z-index: 5;
}

.burst {
  position: fixed;
  left: 50%;
  top: 50%;
  font-size: 25px;
  pointer-events: none;
  z-index: 10;
  animation: burst 1.3s ease-out forwards;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

@keyframes burst {
  0% {
    transform: translate(-50%, -50%) scale(.3);
    opacity: 1;
  }
  100% {
    transform: translate(var(--x), var(--y)) scale(1.8);
    opacity: 0;
  }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 500px) {
  #app { padding: 16px; }
  .photo-card { padding: 7px 7px 13px; }
  .nav { gap: 12px; margin-top: 28px; }
  .nav button { padding: 11px 15px; font-size: 9px; }
}

@media(max-height: 650px) {
  .photo-grid { max-width: 550px; }
  .photo-card { aspect-ratio: 1.05; }
  .photo-card:nth-child(2) { margin-top: 10px; }
  .nav { margin-top: 18px; }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<main id="app">

  <!-- FIRST PAGE -->

  <section id="intro">
    <div class="ornament">✦ ♡ ✦</div>

    <div class="small-title">A little question for you</div>

    <h1>Do You<br>Love Me?</h1>

    <div class="question">CHOOSE YOUR ANSWER</div>

    <div class="buttons">
      <button class="yes-btn" onclick="startLove()">
        YES ♡
      </button>

      <button class="no-btn" disabled>
        NO
      </button>
    </div>

    <div class="bottom-ornament">FOREVER & ALWAYS</div>
  </section>


  <!-- STORY PAGES -->

  <section id="story">

    <div class="top-line"></div>

    <div class="progress-wrap" id="progress"></div>

    <div class="slide-count" id="slideCount">01 / 06</div>

    <div class="photo-grid" id="photoGrid">

      <div class="photo-card">
        <img id="photo1" alt="Our memory 1">
      </div>

      <div class="photo-card">
        <img id="photo2" alt="Our memory 2">
      </div>

    </div>

    <div id="endMessage">♡ I LOVE YOU ♡</div>

    <div class="nav">
      <button id="prevBtn" onclick="changeSlide(-1)">
        PREVIOUS
      </button>

      <button id="nextBtn" onclick="changeSlide(1)">
        NEXT →
      </button>
    </div>

    <div class="top-line" style="margin-top:30px"></div>

  </section>

</main>


<script>

/* =====================================
   ตั้งค่ารูปภาพ 12 รูป ตรงนี้
   ===================================== */

const slides = [
  [
    "F603F623-1C61-4CBA-9774-4E6C04BE6B61.jpeg",
    "224045B1-27CC-4638-8C23-925215A7AE64.jpeg"
  ],
  [
    "images/photo3.jpg",
    "images/photo4.jpg"
  ],
  [
    "images/photo5.jpg",
    "images/photo6.jpg"
  ],
  [
    "images/photo7.jpg",
    "images/photo8.jpg"
  ],
  [
    "images/photo9.jpg",
    "images/photo10.jpg"
  ],
  [
    "images/photo11.jpg",
    "images/photo12.jpg"
  ]
];

let currentSlide = 0;
let started = false;


/* =====================================
   HEART EFFECT
   ===================================== */

function makeHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = Math.random() > .5 ? "♡" : "♥";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (12 + Math.random() * 22) + "px";
  heart.style.animationDuration = (5 + Math.random() * 5) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 10000);
}

setInterval(makeHeart, 900);


/* =====================================
   HEART BURST
   ===================================== */

function heartBurst() {
  for (let i = 0; i < 35; i++) {
    const heart = document.createElement("div");
    heart.className = "burst";
    heart.innerHTML = Math.random() > .5 ? "♥" : "♡";

    const angle = Math.random() * Math.PI * 2;
    const distance = 100 + Math.random() * 250;

    heart.style.setProperty("--x", Math.cos(angle) * distance + "px");
    heart.style.setProperty("--y", Math.sin(angle) * distance + "px");

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 1400);
  }
}


/* =====================================
   START
   ===================================== */

function startLove() {
  if (started) return;

  started = true;
  heartBurst();

  setTimeout(() => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("story").style.display = "block";

    currentSlide = 0;
    renderSlide();
  }, 950);
}


/* =====================================
   DISPLAY SLIDE
   ===================================== */

function renderSlide() {
  const images = slides[currentSlide];

  const img1 = document.getElementById("photo1");
  const img2 = document.getElementById("photo2");

  img1.classList.remove("missing");
  img2.classList.remove("missing");

  img1.src = images[0];
  img2.src = images[1];

  img1.onerror = () => img1.classList.add("missing");
  img2.onerror = () => img2.classList.add("missing");

  document.getElementById("slideCount").textContent =
    String(currentSlide + 1).padStart(2, "0") + " / 06";

  document.getElementById("prevBtn").disabled =
    currentSlide === 0;

  document.getElementById("nextBtn").textContent =
    currentSlide === 5 ? "FINISH ♡" : "NEXT →";

  document.getElementById("endMessage").style.display =
    currentSlide === 5 ? "block" : "none";

  document.getElementById("progress").innerHTML = "";

  for (let i = 0; i < 6; i++) {
    const bar = document.createElement("div");
    bar.className = "progress" + (i <= currentSlide ? " active" : "");
    document.getElementById("progress").appendChild(bar);
  }

  document.getElementById("photoGrid").style.animation = "none";
  void document.getElementById("photoGrid").offsetWidth;
  document.getElementById("photoGrid").style.animation = "appear .5s ease";
}


/* =====================================
   NEXT / PREVIOUS
   ===================================== */

function changeSlide(direction) {
  const next = currentSlide + direction;

  if (next < 0 || next >= 6) return;

  currentSlide = next;
  renderSlide();

  if (currentSlide === 5) {
    heartBurst();
  }
}


/* =====================================
   SWIPE FOR MOBILE
   ===================================== */

let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

document.addEventListener("touchend", (e) => {
  touchEndX = e.changedTouches[0].screenX;

  const distance = touchEndX - touchStartX;

  if (!started || Math.abs(distance) < 60) return;

  if (distance < 0) {
    changeSlide(1);
  } else {
    changeSlide(-1);
  }
}, { passive: true });


/* =====================================
   KEYBOARD
   ===================================== */

document.addEventListener("keydown", (e) => {
  if (!started) return;

  if (e.key === "ArrowRight") changeSlide(1);
  if (e.key === "ArrowLeft") changeSlide(-1);
});

</script>

</body>
</html>
