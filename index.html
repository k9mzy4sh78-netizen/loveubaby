
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16090e">
<title>Love You Baby ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #16090e;
  --wine: #501c2c;
  --gold: #d8b77a;
  --cream: #f8eadb;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 40%, #48202d 0%, #241019 45%, #10070b 100%);
  color: var(--cream);
  font-family: 'Montserrat', sans-serif;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
}

#app {
  min-height: 100vh;
  min-height: 100svh;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  position: relative;
  isolation: isolate;
}

.glow {
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: #a33b5b;
  filter: blur(120px);
  opacity: .16;
  pointer-events: none;
  z-index: -1;
}

.glow.one {
  top: -100px;
  left: -100px;
}

.glow.two {
  right: -100px;
  bottom: -100px;
}

/* INTRO */

#intro {
  width: 100%;
  max-width: 500px;
  text-align: center;
  animation: appear 1.2s ease both;
}

.ornament {
  color: var(--gold);
  font-size: 26px;
  letter-spacing: 12px;
  margin-bottom: 28px;
}

.small-title {
  font-size: 10px;
  letter-spacing: 5px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 22px;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(55px, 12vw, 85px);
  font-weight: 500;
  line-height: .95;
  color: var(--cream);
  margin-bottom: 22px;
}

.question {
  color: #d5b9b2;
  font-size: 12px;
  letter-spacing: 4px;
  margin-bottom: 45px;
}

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
}

.yes-btn, .no-btn {
  width: 130px;
  padding: 15px 10px;
  border-radius: 3px;
  letter-spacing: 3px;
  font-size: 11px;
}

.yes-btn {
  color: #210d14;
  background: linear-gradient(135deg, #f2d9a5, #c49b5e);
  border: 1px solid var(--gold);
  cursor: pointer;
  transition: .3s;
}

.yes-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 30px #d8b77a55;
}

.no-btn {
  color: #9a7c80;
  background: #ffffff08;
  border: 1px solid #76515c;
  opacity: .55;
  cursor: not-allowed;
}

.bottom-ornament {
  margin-top: 65px;
  color: #a77a70;
  font-size: 12px;
  letter-spacing: 7px;
}

/* STORY */

#story {
  display: none;
  width: 100%;
  max-width: 900px;
  text-align: center;
  animation: appear .8s ease both;
}

.top-line {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin-bottom: 25px;
  opacity: .65;
}

.progress-wrap {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 25px;
}

.progress {
  height: 2px;
  width: 32px;
  background: #69434d;
  transition: .4s;
}

.progress.active {
  background: var(--gold);
  box-shadow: 0 0 8px #d8b77a88;
}

.slide-count {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 4px;
  margin-bottom: 25px;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(10px, 3vw, 25px);
  max-width: 760px;
  margin: 0 auto;
}

.photo-card {
  background: #f4e8d8;
  padding: 10px 10px 18px;
  box-shadow: 0 15px 40px #0008;
  transform: rotate(-2deg);
  transition: transform .5s;
  aspect-ratio: .78;
  overflow: hidden;
}

.photo-card:nth-child(2) {
  transform: rotate(2deg);
  margin-top: 25px;
}

.photo-card:hover {
  transform: rotate(0deg) translateY(-5px);
}

.photo-card img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #3b202a;
}

.photo-card img.missing {
  visibility: hidden;
}

.nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  margin-top: 35px;
}

.nav button {
  background: transparent;
  border: 1px solid #a17b64;
  color: var(--cream);
  padding: 12px 24px;
  font-size: 10px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: .3s;
}

.nav button:hover:not(:disabled) {
  background: var(--gold);
  color: #1b0b10;
}

.nav button:disabled {
  opacity: .25;
  cursor: default;
}

#endMessage {
  display: none;
  margin-top: 25px;
  color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  letter-spacing: 3px;
}

/* HEART EFFECTS */

.heart {
  position: fixed;
  bottom: -30px;
  color: #d98ba0;
  pointer-events: none;
  animation: floatUp linear forwards;
  z-index: 5;
}

.burst {
  position: fixed;
  left: 50%;
  top: 50%;
  font-size: 25px;
  pointer-events: none;
  z-index: 10;
  animation: burst 1.3s ease-out forwards;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

@keyframes burst {
  0% {
    transform: translate(-50%, -50%) scale(.3);
    opacity: 1;
  }
  100% {
    transform: translate(var(--x), var(--y)) scale(1.8);
    opacity: 0;
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MOBILE */

@media(max-width: 500px) {
  #app {
    padding: 16px;
  }

  .photo-card {
    padding: 7px 7px 13px;
  }

  .nav {
    gap: 12px;
    margin-top: 28px;
  }

  .nav button {
    padding: 11px 15px;
    font-size: 9px;
  }
}

@media(max-height: 650px) {
  #app {
    padding-top: 10px;
    padding-bottom: 10px;
  }

  .photo-grid {
    max-width: 550px;
  }

  .photo-card {
    aspect-ratio: 1.05;
  }

  .photo-card:nth-child(2) {
    margin-top: 10px;
  }

  .nav {
    margin-top: 18px;
  }

  .slide-count {
    margin-bottom: 14px;
  }

  .progress-wrap {
    margin-bottom: 14px;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<main id="app">

  <!-- FIRST PAGE -->

  <section id="intro">
    <div class="ornament">✦ ♡ ✦</div>

    <div class="small-title">A little question for you</div>

    <h1>Do You<br>Love Me?</h1>

    <div class="question">CHOOSE YOUR ANSWER</div>

    <div class="buttons">
      <button class="yes-btn" onclick="startLove()">
        YES ♡
      </button>

      <button class="no-btn" disabled aria-disabled="true">
        NO
      </button>
    </div>

    <div class="bottom-ornament">FOREVER & ALWAYS</div>
  </section>


  <!-- STORY PAGES -->

  <section id="story" aria-label="Our photo story">

    <div class="top-line"></div>

    <div class="progress-wrap" id="progress"></div>

    <div class="slide-count" id="slideCount">01 / 06</div>

    <div class="photo-grid" id="photoGrid">

      <div class="photo-card">
        <img id="photo1" alt="Our memory 1">
      </div>

      <div class="photo-card">
        <img id="photo2" alt="Our memory 2">
      </div>

    </div>

    <div id="endMessage">♡ I LOVE YOU ♡</div>

    <div class="nav">
      <button id="prevBtn" onclick="changeSlide(-1)">
        PREVIOUS
      </button>

      <button id="nextBtn" onclick="changeSlide(1)">
        NEXT →
      </button>
    </div>

    <div class="top-line" style="margin-top:30px"></div>

  </section>

</main>


<script>

/* =====================================
   PHOTO FILES
   รูปทั้งหมด 12 รูป / 6 หน้า
   ===================================== */

const slides = [
  [
    "F603F623-1C61-4CBA-9774-4E6C04BE6B61.jpeg",
    "224045B1-27CC-4638-8C23-925215A7AE64.jpeg"
  ],
  [
    "80A0D29F-981D-481A-BE4A-522BBCE6FDE3.JPG",
    "BB946083-B3D7-49B3-8749-B5B51A993C8A.JPG"
  ],
  [
    "279F9F55-5AF3-45D9-9576-84210D46F7F6.JPG",
    "76FD189D-C9C7-48CF-9C6B-519E0610A3D8.JPG"
  ],
  [
    "F778232C-A187-4DA4-94BB-DF1404807B25.JPG",
    "00D69F7F-4F21-4EAB-BF69-7E079420B02F.JPG"
  ],
  [
    "AB278DF3-8757-49AA-BDEF-58116C797C5A.JPG",
    "D4ED3852-F9F8-4490-B904-C33C3BBDA57A.JPG"
  ],
  [
    "80C8F0BC-46DB-4B11-BFF3-338364967D01.JPG",
    "D85EABF9-8A07-42BC-8930-7ACA5A6EF45E.JPG"
  ]
];

let currentSlide = 0;
let started = false;


/* =====================================
   FLOATING HEARTS
   ===================================== */

function makeHeart() {
  const heart = document.createElement("div");

  heart.className = "heart";
  heart.textContent = Math.random() > .5 ? "♡" : "♥";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (12 + Math.random() * 22) + "px";
  heart.style.animationDuration = (5 + Math.random() * 5) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 10000);
}

setInterval(makeHeart, 900);


/* =====================================
   HEART BURST
   ===================================== */

function heartBurst() {
  for (let i = 0; i < 35; i++) {
    const heart = document.createElement("div");

    heart.className = "burst";
    heart.textContent = Math.random() > .5 ? "♥" : "♡";

    const angle = Math.random() * Math.PI * 2;
    const distance = 100 + Math.random() * 250;

    heart.style.setProperty(
      "--x",
      Math.cos(angle) * distance + "px"
    );

    heart.style.setProperty(
      "--y",
      Math.sin(angle) * distance + "px"
    );

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 1400);
  }
}


/* =====================================
   START STORY
   ===================================== */

function startLove() {
  if (started) return;

  started = true;
  heartBurst();

  setTimeout(() => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("story").style.display = "block";

    currentSlide = 0;
    renderSlide();
  }, 950);
}


/* =====================================
   DISPLAY SLIDE
   ===================================== */

function renderSlide() {
  const images = slides[currentSlide];

  const img1 = document.getElementById("photo1");
  const img2 = document.getElementById("photo2");

  img1.classList.remove("missing");
  img2.classList.remove("missing");

  img1.src = images[0];
  img2.src = images[1];

  img1.onerror = () => {
    img1.classList.add("missing");
    console.error("Image not found:", images[0]);
  };

  img2.onerror = () => {
    img2.classList.add("missing");
    console.error("Image not found:", images[1]);
  };

  document.getElementById("slideCount").textContent =
    String(currentSlide + 1).padStart(2, "0") + " / 06";

  document.getElementById("prevBtn").disabled =
    currentSlide === 0;

  document.getElementById("nextBtn").textContent =
    currentSlide === 5 ? "FINISH ♡" : "NEXT →";

  document.getElementById("endMessage").style.display =
    currentSlide === 5 ? "block" : "none";

  const progress = document.getElementById("progress");
  progress.innerHTML = "";

  for (let i = 0; i < 6; i++) {
    const bar = document.createElement("div");

    bar.className =
      "progress" + (i <= currentSlide ? " active" : "");

    progress.appendChild(bar);
  }

  const grid = document.getElementById("photoGrid");

  grid.style.animation = "none";
  void grid.offsetWidth;
  grid.style.animation = "appear .5s ease";
}


/* =====================================
   NEXT / PREVIOUS
   ===================================== */

function changeSlide(direction) {
  const next = currentSlide + direction;

  if (next < 0 || next >= slides.length) return;

  currentSlide = next;
  renderSlide();

  if (currentSlide === 5) {
    heartBurst();
  }
}


/* =====================================
   MOBILE SWIPE
   ===================================== */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener("touchstart", (e) => {
  if (!started || e.touches.length !== 1) return;

  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener("touchend", (e) => {
  if (!started || e.changedTouches.length !== 1) return;

  const endX = e.changedTouches[0].screenX;
  const endY = e.changedTouches[0].screenY;

  const distanceX = endX - touchStartX;
  const distanceY = endY - touchStartY;

  if (Math.abs(distanceX) < 60) return;
  if (Math.abs(distanceX) < Math.abs(distanceY)) return;

  if (distanceX < 0) {
    changeSlide(1);
  } else {
    changeSlide(-1);
  }
}, { passive: true });


/* =====================================
   KEYBOARD
   ===================================== */

document.addEventListener("keydown", (e) => {
  if (!started) return;

  if (e.key === "ArrowRight") changeSlide(1);
  if (e.key === "ArrowLeft") changeSlide(-1);
});

</script>

</body>
</html>
