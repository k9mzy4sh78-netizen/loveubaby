
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love My Couple 🤍</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(
    120deg,
    #a8ddff,
    #ffd2e8,
    #b8e5ff,
    #ffc8e5
  );
  background-size: 400% 400%;
  animation: gradient 12s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 15px;
}

@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.card {
  width: 100%;
  max-width: 420px;
  padding: 30px 20px;
  text-align: center;
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 30px;
  box-shadow: 0 12px 40px rgba(90,120,180,0.15);
  backdrop-filter: blur(12px);
  position: relative;
  z-index: 2;
}

h1 {
  color: #5b6eaa;
  font-size: 27px;
  line-height: 1.4;
  margin-bottom: 10px;
}

.subtitle {
  color: #9b709b;
  font-size: 14px;
  margin-bottom: 25px;
}

.photos {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
}

.photos img {
  width: 42%;
  max-width: 155px;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 22px;
  border: 4px solid white;
  box-shadow: 0 5px 18px rgba(100,100,150,0.18);
  transition: transform 0.3s ease;
}

.photos img:hover {
  transform: scale(1.06) rotate(-2deg);
}

.love {
  font-size: 35px;
  margin-top: 22px;
  animation: beat 1.3s infinite;
}

@keyframes beat {
  50% { transform: scale(1.2); }
}

.footer {
  margin-top: 18px;
  color: #8b79a8;
  font-size: 13px;
}

.heart {
  position: fixed;
  bottom: -30px;
  color: rgba(255,255,255,0.8);
  font-size: 22px;
  animation: float 8s linear infinite;
  z-index: 1;
  pointer-events: none;
}

.heart:nth-child(1) { left: 10%; animation-delay: 0s; }
.heart:nth-child(2) { left: 30%; animation-delay: 2s; }
.heart:nth-child(3) { left: 55%; animation-delay: 4s; }
.heart:nth-child(4) { left: 78%; animation-delay: 1s; }
.heart:nth-child(5) { left: 90%; animation-delay: 3s; }

@keyframes float {
  0% { transform: translateY(0) rotate(0); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>

<body>

<div class="heart">♡</div>
<div class="heart">♥</div>
<div class="heart">♡</div>
<div class="heart">♥</div>
<div class="heart">♡</div>

<main class="card">
  <h1>I love my couple Hooda🤍</h1>
  <p class="subtitle">You are my favorite person ♡</p>

  <div class="photos">
    <img src="F603F623-1C61-4CBA-9774-4E6C04BE6B61.jpeg" alt="Dudu">
    <img src="224045B1-27CC-4638-8C23-925215A7AE64.jpeg" alt="Bubu">
  </div>

  <div class="love">💗</div>
  <p class="footer">Together is my favorite place to be ♡</p>
</main>

</body>
</html>
